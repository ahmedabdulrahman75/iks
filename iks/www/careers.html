{% extends 'templates/iks_base.html'%} {% block content %}
<main class="container py-5">
	<div class="row justify-content-center">
		<div class="col-sm-10 col-md-6 col-lg-5">
			<div class="card shadow-sm">
				<div class="card-body">
					<h5 class="card-title mb-3">Upload Your CV</h5>
					<form id="uploadForm" novalidate>
						<div class="mb-3">
							<label for="fileInput" class="form-label visually-hidden"
								>Choose file</label
							>

							<!-- Custom Bootstrap file input -->
							<input
								class="form-control"
								type="file"
								id="fileInput"
								name="file"
								accept=".pdf"
								aria-describedby="fileHelp"
								required
							/>

							<div id="fileHelp" class="form-text">Accepted Files: pdf.</div>
						</div>

						<div class="d-grid">
							<button id="submitBtn" class="btn btn-primary" type="submit">
								Submit
							</button>
						</div>
					</form>

					<div
						class="mt-3"
						id="selectedFileName"
						style="min-height: 1.2em; font-size: 0.95rem; color: #333"
					></div>
				</div>
			</div>
		</div>
	</div>
	<!-- Toast Container -->
	<div class="position-fixed bottom-1 end-0 p-3" style="z-index: 9999">
		<!-- Success Toast -->
		<div
			id="successToast"
			class="toast align-items-center bg-success text-white border-0 mb-2"
			role="alert"
			data-bs-delay="3000"
		>
			<div class="d-flex">
				<div class="toast-body">CV uploaded successfully!</div>
				<button
					type="button"
					class="btn-close btn-close-white me-2 m-auto"
					data-bs-dismiss="toast"
				></button>
			</div>
		</div>
		<div
			id="errorToast"
			class="toast align-items-center bg-danger text-white border-0"
			role="alert"
			data-bs-autohide="true"
			data-bs-delay="3000"
		>
			<div class="d-flex">
				<div class="toast-body">Something went wrong. Try again.</div>
				<button
					type="button"
					class="btn-close btn-close-white me-2 m-auto"
					data-bs-dismiss="toast"
				></button>
			</div>
		</div>
	</div>
</main>
<script>
	const fileInput = document.getElementById("fileInput");
	const selected = document.getElementById("selectedFileName");
	const form = document.getElementById("uploadForm");
	const submitBtn = document.getElementById("submitBtn");

	fileInput.addEventListener("change", () => {
		const file = fileInput.files[0];
		if (!file) {
			selected.textContent = "";
			return;
		}
		selected.textContent = `Selected file: ${file.name} (${Math.round(file.size / 1024)} KB)`;
	});

	form.addEventListener("submit", async (e) => {
		e.preventDefault();
		submitBtn.disabled = true;
		const file = fileInput.files[0];
		const allowedTypes = ["application/pdf"];
		if (!fileInput.files.length) {
			fileInput.focus();
			selected.textContent = "Please choose a file before submitting.";
			selected.style.color = "crimson";
		} else if (!allowedTypes.includes(file.type)) {
			fileInput.focus();
			selected.textContent = "Please choose a right file type.";
			selected.style.color = "crimson";
		} else {
			const formData = new FormData();
			formData.append("cv", file);
			const res = await fetch("/api/method/iks.api.job_applications.apply_for_job", {
				method: "POST",
				credentials: "omit",
				body: formData,
			});
			const data = await res.json();
			if (data.message.success) {
				const toastEl = document.getElementById("successToast");
				const toast = new bootstrap.Toast(toastEl);
				toast.show();
				form.reset();
			} else {
				const toastEl = document.getElementById("errorToast");
				const toast = new bootstrap.Toast(toastEl);
				toast.show();
			}
		}
		submitBtn.disabled = false;
	});
</script>
{% endblock %}
