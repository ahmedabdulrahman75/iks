{% extends 'templates/iks_base.html'%} {% block content %}
<main class="container py-5">
	<div class="row justify-content-center">
		<div class="col-sm-10 col-md-6 col-lg-5">
			<div class="card shadow-sm">
				<div class="card-body">
					<h5 class="card-title mb-3">Upload Your CV</h5>

					<!-- Form: POST to /upload (change action as needed) -->
					<form id="uploadForm" novalidate>
						<div class="mb-3">
							<label for="fileInput" class="form-label visually-hidden"
								>Choose file</label
							>

							<!-- Custom Bootstrap file input -->
							<input
								class="form-control"
								type="file"
								id="fileInput"
								name="file"
								accept=".pdf,.jpg,.png,.docx"
								aria-describedby="fileHelp"
								required
							/>

							<div id="fileHelp" class="form-text">Accepted Files: pdf.</div>
						</div>

						<div class="d-grid">
							<button id="submitBtn" class="btn btn-primary" type="submit">
								Submit
							</button>
						</div>
					</form>

					<!-- Small area that shows the selected file name -->
					<div
						class="mt-3"
						id="selectedFileName"
						style="min-height: 1.2em; font-size: 0.95rem; color: #333"
					></div>
				</div>
			</div>
		</div>
	</div>
</main>
<script>
	const fileInput = document.getElementById("fileInput");
	const selected = document.getElementById("selectedFileName");

	fileInput.addEventListener("change", () => {
		const file = fileInput.files[0];
		if (!file) {
			selected.textContent = "";
			return;
		}
		selected.textContent = `Selected file: ${file.name} (${Math.round(file.size / 1024)} KB)`;
	});

	// Optional: basic client-side validation to ensure a file is chosen
	document.getElementById("uploadForm").addEventListener("submit", async (e) => {
		e.preventDefault();
		const file = fileInput.files[0];
		const allowedTypes = ["application/pdf"];
		if (!fileInput.files.length) {
			fileInput.focus();
			selected.textContent = "Please choose a file before submitting.";
			selected.style.color = "crimson";
		} else if (!allowedTypes.includes(file.type)) {
			fileInput.focus();
			selected.textContent = "Please choose a right file type.";
			selected.style.color = "crimson";
		} else {
			console.log("hello");
			const formData = new FormData();
			formData.append("cv", file);
			const res = await fetch("/api/method/iks.api.job_applications.apply_for_job", {
				method: "POST",
				body: formData
			});
			const data = await res.json();
			console.log("Upload result:", data.message);
		}
	});
</script>
{% endblock %}
